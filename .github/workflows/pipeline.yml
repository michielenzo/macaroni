name: Pipeline

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build Windows application
        run: dotnet build src/Macaroni/Macaroni.csproj --configuration Release

      # This repository uses a test executable, not a dotnet test framework.
      # Any failed check throws and returns a nonzero exit code to fail the job.
      - name: Run automated checks
        run: dotnet run --project tests/Macaroni.Tests --configuration Release -- config.example.json
